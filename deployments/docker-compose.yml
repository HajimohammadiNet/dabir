services:
  postgres:
    image: postgres:17-alpine
    container_name: dabir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dabir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dabir_secret}
      POSTGRES_DB: ${DB_NAME:-dabir}
    volumes:
      - dabir_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-dabir} -d ${DB_NAME:-dabir}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dabir-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dabir}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dabir_minio_secret}
    volumes:
      - dabir_minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: dabir-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-dabir}
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dabir}
      DB_PASSWORD: ${DB_PASSWORD:-dabir_secret}
      DB_NAME: ${DB_NAME:-dabir}
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}

      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-60}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Accept,Authorization,Content-Type,X-CSRF-Token,X-Request-ID}

      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-dabir-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dabir}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dabir_minio_secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGNED_URL_TTL_MINUTES: ${S3_PRESIGNED_URL_TTL_MINUTES:-15}
      S3_MAX_UPLOAD_SIZE_MB: ${S3_MAX_UPLOAD_SIZE_MB:-20}

    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: dabir-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  dabir_postgres_data:
  dabir_minio_data: