openapi: 3.0.3

info:
  title: Dabir API
  description: |
    Dabir is an open-source letter numbering and registry backend built with Go and PostgreSQL.

    It provides APIs for:
    - Initial setup
    - Authentication
    - User management
    - Incoming and outgoing letter management
    - Audit logs
    - Public settings
  version: 0.6.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Setup
    description: Initial setup wizard
  - name: Settings
    description: Public application settings
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management endpoints
  - name: Letters
    description: Incoming and outgoing letter registry endpoints
  - name: Imports
    description: Excel imports
  - name: Audit Logs
    description: Audit log endpoints

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags:
        - Health
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/setup/status:
    get:
      tags:
        - Setup
      summary: Get setup status
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"

  /api/v1/setup/initialize:
    post:
      tags:
        - Setup
      summary: Initialize application
      description: Creates the initial superuser and stores initial application settings. Can only be executed once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeRequest"
      responses:
        "201":
          description: Application initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeResponse"
        "409":
          description: Application already initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/settings/public:
    get:
      tags:
        - Settings
      summary: Get public settings
      security: []
      responses:
        "200":
          description: Public settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettingsResponse"

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Inactive user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users:
    get:
      tags:
        - Users
      summary: List users
      description: Requires superuser role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum:
              - superuser
              - editor
              - readonly
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Users
      summary: Create user
      description: Requires superuser role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Requires superuser role.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Users
      summary: Update user
      description: Requires superuser role.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{id}/deactivate:
    patch:
      tags:
        - Users
      summary: Deactivate user
      description: Requires superuser role.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanActionResponse"

  /api/v1/users/{id}/activate:
    patch:
      tags:
        - Users
      summary: Activate user
      description: Requires superuser role.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanActionResponse"

  /api/v1/letters:
    get:
      operationId: listLetters
      tags:
        - Letters
      summary: List letters
      description: Requires superuser, editor, or readonly role. Direction defaults to incoming for backward compatibility.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          schema:
            type: string
        - name: direction
          in: query
          description: Letter direction. Omit to list incoming letters.
          schema:
            $ref: "#/components/schemas/LetterDirection"
        - name: registrar_name
          in: query
          schema:
            type: string
        - name: sender
          in: query
          schema:
            type: string
        - name: receiver
          in: query
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: include_deleted
          in: query
          schema:
            type: boolean
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, letter_date, letter_number]
            default: letter_date
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Letters list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLettersResponse"
        "400":
          description: Invalid direction, date, pagination, or sort parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createLetter
      tags:
        - Letters
      summary: Create letter
      description: Requires superuser or editor role. Direction defaults to incoming when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLetterRequest"
      responses:
        "201":
          description: Letter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/letters/number-suggestion:
    get:
      operationId: suggestLetterNumber
      tags:
        - Letters
      summary: Suggest the next manual letter number
      description: Requires superuser, editor, or readonly role. The lookup is scoped to direction, which defaults to incoming.
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
          example: 405-ق-
        - name: direction
          in: query
          schema:
            $ref: "#/components/schemas/LetterDirection"
      responses:
        "200":
          description: Direction-aware number suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterNumberSuggestionResponse"
        "400":
          description: Invalid direction or suggestion request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/letters/{id}/attachments:
    get:
      operationId: listLetterAttachments
      tags:
        - Letters
      summary: List letter attachments
      description: Requires superuser, editor, or readonly role.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Active attachments for the letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "400":
          description: Letter not found or attachment list failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: uploadLetterAttachments
      tags:
        - Letters
      summary: Upload letter attachments
      description: Requires superuser or editor role. Supports multiple private PDF, JPG, or PNG files using the configured maximum upload size.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Attachments uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "400":
          description: Invalid file, size, type, or letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/letters/{id}/attachments/{attachment_id}/download-url:
    get:
      operationId: getLetterAttachmentDownloadUrl
      tags:
        - Letters
      summary: Create a private attachment download URL
      description: Requires superuser, editor, or readonly role. Returns a short-lived server-generated presigned URL.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: attachment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Presigned download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentDownloadURLResponse"
        "400":
          description: Letter attachment not found or URL generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/letters/{id}/attachments/{attachment_id}:
    delete:
      operationId: deleteLetterAttachment
      tags:
        - Letters
      summary: Delete a letter attachment
      description: Requires superuser or editor role. Soft-deletes attachment metadata and removes the private object.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: attachment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attachment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanActionResponse"
        "400":
          description: Letter attachment not found or deletion failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/letters/{id}:
    get:
      operationId: getLetter
      tags:
        - Letters
      summary: Get letter by ID
      description: Requires superuser, editor, or readonly role.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Letter details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterResponse"
        "404":
          description: Letter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateLetter
      tags:
        - Letters
      summary: Update letter
      description: Requires superuser or editor role.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLetterRequest"
      responses:
        "200":
          description: Letter updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterResponse"
        "400":
          description: Invalid update request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteLetter
      tags:
        - Letters
      summary: Soft delete letter
      description: Requires superuser or editor role.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Letter deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanActionResponse"
        "404":
          description: Letter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/imports/letters/preview:
    post:
      tags:
        - Imports
      operationId: previewLettersImport
      summary: Preview letters Excel import
      description: Requires superuser role. Uploads and validates an Excel file without inserting rows into the letters table.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Import preview created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobResponse"
        "400":
          description: Invalid file or import preview failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/imports/letters/{id}/commit:
    post:
      tags:
        - Imports
      operationId: commitLettersImport
      summary: Commit letters import
      description: Requires superuser role. Inserts valid preview rows into the letters table and updates the letter number sequence.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitImportResponse"
        "400":
          description: Import has invalid rows or commit failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Import job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Import already committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/imports/{id}:
    get:
      tags:
        - Imports
      operationId: getImportJobById
      summary: Get import job by ID
      description: Requires superuser role.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Import job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobResponse"
        "404":
          description: Import job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/audit-logs:
    get:
      tags:
        - Audit Logs
      summary: List audit logs
      description: Requires superuser role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: action
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: actor_user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit logs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditLogsResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1

    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  schemas:
    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ImportError:
      type: object
      properties:
        row:
          type: integer
        field:
          type: string
        message:
          type: string

    ImportedLetterRow:
      type: object
      properties:
        row_number:
          type: integer
        letter_number:
          type: integer
          format: int64
        title:
          type: string
        letter_date:
          type: string
          format: date
        sender:
          type: string
        receiver:
          type: string

    ImportJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: letters
        status:
          type: string
          enum:
            - previewed
            - committed
            - failed
        file_name:
          type: string
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        max_letter_number:
          type: integer
          format: int64
          nullable: true
        detected_columns:
          type: object
          additionalProperties:
            type: string
        preview_data:
          type: array
          items:
            $ref: "#/components/schemas/ImportedLetterRow"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"
        created_by:
          type: string
          format: uuid
        committed_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        committed_at:
          type: string
          format: date-time
          nullable: true

    ImportJobResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/ImportJob"

    CommitImportData:
      type: object
      properties:
        import_id:
          type: string
          format: uuid
        imported_rows:
          type: integer
        skipped_rows:
          type: integer
        next_letter_number:
          type: integer
          format: int64

    CommitImportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/CommitImportData"

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: "#/components/schemas/APIError"

    HealthData:
      type: object
      properties:
        status:
          type: string
          example: ok

    ReadyData:
      type: object
      properties:
        status:
          type: string
          example: ready
        database:
          type: string
          example: ok

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/HealthData"

    ReadyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/ReadyData"

    SetupStatus:
      type: object
      properties:
        initialized:
          type: boolean
        setup_needed:
          type: boolean

    SetupStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/SetupStatus"

    InitializeRequest:
      type: object
      required:
        - organization_name
        - superuser
        - letter_config
      properties:
        organization_name:
          type: string
          example: Dabir
        superuser:
          type: object
          required:
            - username
            - full_name
            - password
          properties:
            username:
              type: string
              example: admin
            full_name:
              type: string
              example: System Administrator
            password:
              type: string
              format: password
              example: Admin123456!
        letter_config:
          type: object
          required:
            - number_prefix
            - number_padding
          properties:
            number_prefix:
              type: string
              example: DABIR
            number_padding:
              type: integer
              example: 6

    InitializeData:
      type: object
      properties:
        initialized:
          type: boolean
        user_id:
          type: string
          format: uuid
        username:
          type: string

    InitializeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/InitializeData"

    LetterNumberConfig:
      type: object
      properties:
        numbering_mode:
          type: string
          enum: [fixed_prefix, jalali_yearly, manual]
        number_prefix:
          type: string
        number_padding:
          type: integer
        yearly_prefix_digits:
          type: integer
        yearly_serial_padding:
          type: integer
        yearly_separator:
          type: string
        year_source:
          type: string
          enum: [letter_date, created_at]

    PublicSettings:
      type: object
      properties:
        organization_name:
          type: string
        letter_config:
          $ref: "#/components/schemas/LetterNumberConfig"
        outgoing_letter_config:
          $ref: "#/components/schemas/LetterNumberConfig"

    PublicSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/PublicSettings"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: Admin123456!

    LoginUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    LoginData:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: "#/components/schemas/LoginUser"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/LoginData"

    Role:
      type: string
      enum:
        - superuser
        - editor
        - readonly

    User:
